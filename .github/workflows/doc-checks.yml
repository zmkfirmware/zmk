name: Docs Checks

on:
  push:
    paths:
      - ".github/workflows/doc-checks.yml"
      - "docs/**"
  pull_request:
    paths:
      - ".github/workflows/doc-checks.yml"
      - "docs/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          working-directory: docs
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true
      - name: ESLint
        run: pnpm lint
        working-directory: docs
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          working-directory: docs
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true
      - name: Build
        run: pnpm build
        working-directory: docs
      - name: TypeScript check
        run: pnpm typecheck
        working-directory: docs
