version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "daily"
    groups:
      astro-major:
        applies-to: "version-updates"
        dependency-type: "production"
        patterns:
          - "astro"
          - "@astrojs/*"
          - "starlight-blog"
        update-types:
          - "major"
      astro-minor-patch:
        applies-to: "version-updates"
        dependency-type: "production"
        patterns:
          - "astro"
          - "@astrojs/*"
          - "starlight-blog"
        update-types:
          - "minor"
          - "patch"
      tree-sitter:
        applies-to: "version-updates"
        dependency-type: "production"
        patterns:
          - "tree-sitter-devicetree"
          - "web-tree-sitter"
      prod-other-major:
        applies-to: "version-updates"
        dependency-type: "production"
        exclude-patterns:
          - "astro"
          - "@astrojs/*"
          - "starlight-blog"
          - "tree-sitter-devicetree"
          - "web-tree-sitter"
        update-types:
          - "major"
      prod-other-minor-patch:
        applies-to: "version-updates"
        dependency-type: "production"
        exclude-patterns:
          - "astro"
          - "@astrojs/*"
          - "starlight-blog"
          - "tree-sitter-devicetree"
          - "web-tree-sitter"
        update-types:
          - "minor"
          - "patch"
      development:
        applies-to: "version-updates"
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
