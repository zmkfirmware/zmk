# Preserve the pre-Studio diagnostic baseline (Studio selects SETTINGS/PM_DEVICE).
CONFIG_ZMK_STUDIO=n
# Use with observe.conf. Isolate saved state and automatic blanking without erasing storage.
CONFIG_SETTINGS=n
CONFIG_SETTINGS_NVS=n
CONFIG_BT_SETTINGS=n
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=n
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_USB=n
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
CONFIG_ZMK_SLEEP=n
CONFIG_PM_DEVICE=n
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_BACKLIGHT_ON_START=y
# GPIO LED is on for ANY nonzero brightness; preserve the normal default of 40.
