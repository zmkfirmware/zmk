# Preserve the pre-Studio diagnostic baseline (Studio selects SETTINGS/PM_DEVICE).
CONFIG_ZMK_STUDIO=n
# Observe normal behavior, including saved settings and idle management.
CONFIG_NUMPAD_LCD_BACKLIGHT_DIAGNOSTICS=y
CONFIG_ZMK_RTT_LOGGING=y
# Observation must not wait for an RTT reader or stall normal input processing.
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
CONFIG_LOG_BACKEND_RTT_MESSAGE_SIZE=256
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
