# Preserve the pre-Studio diagnostic baseline (Studio selects SETTINGS/PM_DEVICE).
CONFIG_ZMK_STUDIO=n
# Use with observe.conf: retain saved state, disable only automatic blanking.
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=n
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_USB=n
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
CONFIG_ZMK_SLEEP=n
CONFIG_PM_DEVICE=n
