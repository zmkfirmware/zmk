description: SparkFun BlackBerry Trackballer Breakout

compatible: "sparkfun,blackberry-trackballer"

include: base.yaml

properties:
  left-gpios:
    type: phandle-array
    required: true
    description: GPIO connected to the active-high LFT movement output.

  right-gpios:
    type: phandle-array
    required: true
    description: GPIO connected to the active-high RHT movement output.

  up-gpios:
    type: phandle-array
    required: true
    description: GPIO connected to the active-high UP movement output.

  down-gpios:
    type: phandle-array
    required: true
    description: GPIO connected to the active-high DWN movement output.

  button-gpios:
    type: phandle-array
    required: true
    description: GPIO connected to the trackball push button, normally active low.

  zephyr,axis-x:
    type: int
    required: true
    description: Zephyr relative input code used for horizontal movement.

  zephyr,axis-y:
    type: int
    required: true
    description: Zephyr relative input code used for vertical movement.

  button-code:
    type: int
    default: 256
    description: Zephyr input key code emitted by the push button. Defaults to INPUT_BTN_0.

  report-period-ms:
    type: int
    default: 8
    description: |
      Time in milliseconds used to batch accumulated X/Y movement reports
      and as the frame period when interpolation-frames is greater than one.

  interpolation-frames:
    type: int
    default: 1
    description: |
      Maximum number of report frames used to distribute accumulated whole
      movement. One disables interpolation and preserves the original
      single-report behavior. Valid values are 1 through 255.

  debounce-interval-ms:
    type: int
    default: 5
    description: Push-button debounce interval in milliseconds.

  minimum-pulse-interval-us:
    type: int
    default: 0
    description: |
      Minimum interval in microseconds between accepted pulses from the same
      movement GPIO. Pulses arriving sooner are ignored as glitches. A value
      of zero disables movement pulse filtering.

  acceleration-start-hz:
    type: int
    default: 20
    description: Pulse rate at or below which minimum-step is used.

  acceleration-max-hz:
    type: int
    default: 120
    description: Pulse rate at or above which maximum-step is used.

  acceleration-exponent:
    type: int
    default: 2
    description: |
      Exponent applied to the normalized pulse rate between the acceleration
      thresholds. One selects a linear curve, two selects a quadratic curve,
      and higher values make low-speed movement grow more slowly before
      accelerating more strongly near acceleration-max-hz. Valid values are
      1 through 4.

  minimum-step:
    type: int
    default: 1
    description: Relative movement generated by a slow pulse.

  maximum-step:
    type: int
    default: 8
    description: Relative movement generated by a fast pulse.
